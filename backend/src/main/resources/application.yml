server:
  port: 8080

spring:
  application:
    name: nutritionist-backend
  # 默认 H2 内存数据库：无需安装 MySQL 即可运行
  datasource:
    url: jdbc:h2:mem:nutrition;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT 配置
jwt:
  secret: nutritionist-secret-key-please-change-in-production-2024
  expire-hours: 72

logging:
  level:
    com.nutritionist: info

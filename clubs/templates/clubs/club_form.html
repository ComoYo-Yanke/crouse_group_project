{% extends "clubs/base.html" %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<section class="page-head">
    <div>
        <h1>{{ page_title }}</h1>
        <p>填写社团名称、类型、成立日期、活动地点和介绍。</p>
    </div>
    <a class="btn ghost" href="{% url 'club-index' %}">返回列表</a>
</section>

<form class="panel form" method="post">
    {% csrf_token %}
    {% for field in form %}
    <label>
        {{ field.label }}
        {{ field }}
        {% if field.errors %}<span class="error">{{ field.errors|striptags }}</span>{% endif %}
    </label>
    {% endfor %}
    <div class="actions">
        <button class="btn primary" type="submit">{{ submit_text }}</button>
        <a class="btn ghost" href="{% url 'club-index' %}">取消</a>
    </div>
</form>
{% endblock %}
